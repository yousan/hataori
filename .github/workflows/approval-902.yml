name: Approval 902 validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  regression-and-goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the regression fails without the fix
        env:
          BASE_SHA: 562e241865334bd7b30d1e918546367c9c1e6814
        run: |
          set -eu
          cp internal/core/approval.go "$RUNNER_TEMP/approval.go"
          trap 'cp "$RUNNER_TEMP/approval.go" internal/core/approval.go' EXIT
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:internal/core/approval.go" > internal/core/approval.go
          if go test -count=1 -run '^TestApprovalCannotBeRefusedAfterItsInterruptWasNotTaken$' -v ./internal/core > "$RUNNER_TEMP/regression.log" 2>&1; then
            cat "$RUNNER_TEMP/regression.log"
            echo 'The regression unexpectedly passed without the fix.'
            exit 1
          fi
          cat "$RUNNER_TEMP/regression.log"
          grep -F 'a refusal after the reason was given:' "$RUNNER_TEMP/regression.log"
      - name: the approval regressions pass with the fix
        run: go test -count=1 -run '^TestApproval' -v ./internal/core
      - name: generate protocol golden files in CI
        run: go test ./internal/wire -run '^TestGolden$' -update
      - uses: actions/upload-artifact@v4
        with:
          name: approval-902-protocol-goldens
          path: |
            internal/wire/testdata/protocol/3.43/
            internal/wire/testdata/protocol/SUMS
          if-no-files-found: error
