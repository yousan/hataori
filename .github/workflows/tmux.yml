name: tmux compatibility

on:
  pull_request:
    paths:
      - internal/holder/tmux/**
      - internal/hostterm/**
      - internal/runner/closed_terminal_test.go
      - .github/workflows/tmux.yml
  push:
    branches: [main]
    paths:
      - internal/holder/tmux/**
      - internal/hostterm/**
      - internal/runner/closed_terminal_test.go
      - .github/workflows/tmux.yml
  workflow_dispatch:
    inputs:
      count:
        description: Repetitions of each test
        default: '1'
        required: true
      tests:
        description: Test name regular expression
        default: '.'
        required: true
      revision:
        description: Revision under test (defaults to this workflow revision)
        default: ''
        required: false

permissions:
  contents: read

jobs:
  tmux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        version: ['3.2', '3.2a', '3.4', '3.8']
        include:
          # Start requires >=3.2; these release families exercise the exact
          # pipe command directly, including versions before that minimum.
          - version: '3.0a'
            tests: '^TestPipeCommandPreservesLiteralPaths$'
          - version: '3.1c'
            tests: '^TestPipeCommandPreservesLiteralPaths$'
          - version: '3.3a'
            tests: '^TestPipeCommandPreservesLiteralPaths$'
          - version: '3.5a'
            tests: '^TestPipeCommandPreservesLiteralPaths$'
          - version: '3.6b'
            tests: '^TestPipeCommandPreservesLiteralPaths$'
          - version: '3.7c'
            tests: '^TestPipeCommandPreservesLiteralPaths$'
    env:
      TMUX_VERSION: ${{ matrix.version }}
      TEST_COUNT: ${{ inputs.count || '1' }}
      TEST_NAMES: ${{ matrix.tests || inputs.tests || '.' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the tmux version under test
        id: tmux-build
        run: |
          set -eu
          if ! pkg-config --exists libevent ncurses || ! command -v bison >/dev/null; then
            sudo apt-get -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-" update
            sudo apt-get install -y libevent-dev libncurses-dev bison
          fi
          curl -fsSL "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" -o "$RUNNER_TEMP/tmux.tar.gz"
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-$TMUX_VERSION"
          ./configure --prefix="$RUNNER_TEMP/tmux-install"
          make -j2
          make install
          echo "$RUNNER_TEMP/tmux-install/bin" >> "$GITHUB_PATH"
      - name: Test the holder
        run: |
          set -eu
          git rev-parse HEAD
          tmux -V
          go test -timeout 150m -count="$TEST_COUNT" -run "$TEST_NAMES" ./internal/holder/tmux
      - name: Test closed-terminal ownership through the runner
        if: ${{ !cancelled() && steps.tmux-build.outcome == 'success' && !matrix.tests }}
        run: go test -timeout 5m -count="$TEST_COUNT" -run '^TestClosedTerminal' ./internal/runner
      - name: Test host terminal inputs
        if: ${{ !cancelled() && steps.tmux-build.outcome == 'success' && !matrix.tests }}
        run: |
          set -eu
          skip='^$'
          # HostKey documents the complete named-key set of tmux 3.4.
          # Older releases drop C-Tab or type C-M-Tab literally. Keep all
          # other input tests, including real text/paste and fallback.
          case "$TMUX_VERSION" in
            3.2|3.2a) skip='^TestEveryValidKeyIsEncodedByTmux$' ;;
          esac
          go test -timeout 150m -count="$TEST_COUNT" -run "$TEST_NAMES" -skip "$skip" ./internal/hostterm
      - name: Check the split test rejects inherited remain-on-exit
        if: ${{ !cancelled() && steps.tmux-build.outcome == 'success' && matrix.version == '3.8' }}
        run: |
          set -eu
          source=internal/holder/tmux/started.go
          cp "$source" "$RUNNER_TEMP/started-before-mutant.go"
          trap 'cp "$RUNNER_TEMP/started-before-mutant.go" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path("internal/holder/tmux/started.go")
          s = p.read_text()
          before = '"set-option -w -u -t " + r.Pane + " remain-on-exit"'
          after = '"set-option -w -t " + r.Pane + " remain-on-exit on"'
          assert s.count(before) == 1
          p.write_text(s.replace(before, after))
          PYTHON
          if go test -timeout 2m -run '^TestStartInASessionWithAPersonsWindow$' ./internal/holder/tmux > "$RUNNER_TEMP/split-mutant.log" 2>&1; then
            cat "$RUNNER_TEMP/split-mutant.log"
            echo "Split test accepted inherited remain-on-exit"
            exit 1
          fi
          cat "$RUNNER_TEMP/split-mutant.log"
          grep -q 'panes after the second stop' "$RUNNER_TEMP/split-mutant.log"
      - name: Repeat the split test with two concurrent copies
        if: ${{ !cancelled() && steps.tmux-build.outcome == 'success' && !matrix.tests }}
        run: |
          set -eu
          pids=""
          for copy in 1 2 3; do
            go test -timeout 10m -count=30 -run '^TestStartInASessionWithAPersonsWindow$' ./internal/holder/tmux > "$RUNNER_TEMP/split-$copy.log" 2>&1 &
            pids="$pids $!"
          done
          failed=0
          for pid in $pids; do
            wait "$pid" || failed=1
          done
          for copy in 1 2 3; do
            cat "$RUNNER_TEMP/split-$copy.log"
          done
          exit "$failed"
