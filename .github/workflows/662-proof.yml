name: Tmux fixture socket regression proof
on:
  pull_request:
    paths:
      - internal/hostterm/hostterm_test.go
      - .github/workflows/662-proof.yml
permissions:
  contents: read
jobs:
  independent-servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install tmux
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      - name: compare shared and independent sockets
        env:
          PROBE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYPROBE'
          import os, pathlib, subprocess
          p = pathlib.Path('internal/hostterm/hostterm_test.go')
          fixed = p.read_text()
          baseline = subprocess.check_output(['git', 'show', os.environ['PROBE_BASE'] + ':' + str(p)], text=True)
          begin = fixed.index('func TestTmuxFixturesAreIndependent(')
          end = fixed.index('// Only the fixed commands run:', begin)
          baseline += '\n' + fixed[begin:end]
          try:
              for name, source, pattern, count in [
                  ('baseline', baseline, '^TestTmuxFixturesAreIndependent$', '1'),
                  ('fixed', fixed, '^Test(TmuxFixturesAreIndependent|OnlyTheFixedCommandsRun)$', '20'),
              ]:
                  p.write_text(source)
                  result = subprocess.run(['go', 'test', './internal/hostterm', '-count=' + count, '-timeout=3m', '-run', pattern], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                  print(name, 'exit', result.returncode, flush=True)
                  print(result.stdout, flush=True)
                  if name == 'baseline':
                      assert result.returncode != 0 and 'duplicate session' in result.stdout
                  else:
                      assert result.returncode == 0
          finally:
              p.write_text(fixed)
          PYPROBE
