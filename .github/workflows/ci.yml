name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The example plugin is Python 3 (examples/plugins/marker): its tests
      # fail, not skip, without it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The host terminal tests start a tmux server of their own.
      - name: install tmux
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      # The hataori connect tests start an sshd of their own, as this user.
      - name: install sshd
        run: test -x /usr/sbin/sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      - run: go test ./...

  # The same code runs on macOS (design, section 6.4).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install tmux
        run: command -v tmux >/dev/null || brew install tmux
      - run: go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: go test
        run: |
          # Temporary (#485): this user's processes and the memory pressure, sampled while the suite runs.
          ( while true; do echo "SAMPLE $(date +%s) procs=$(ps -U "$(id -u)" -o pid= | wc -l | tr -d ' ') chrome=$(pgrep -f -i 'chrome' | wc -l | tr -d ' ') free=$(memory_pressure -Q 2>/dev/null | awk '/percentage/{print $NF}')"; sleep 2; done ) > samples.txt 2>&1 &
          sampler=$!
          start=$(date +%s)
          status=0
          go test ./... || status=$?
          kill $sampler
          sort -t= -k2 -n samples.txt | awk '{print}' > /dev/null
          echo "most processes of this user: $(sed -n 's/.*procs=\([0-9]*\).*/\1/p' samples.txt | sort -n | tail -1) (kern.maxprocperuid $(sysctl -n kern.maxprocperuid)); most Chrome processes: $(sed -n 's/.*chrome=\([0-9]*\).*/\1/p' samples.txt | sort -n | tail -1); least free memory: $(sed -n 's/.*free=\([0-9]*%\).*/\1/p' samples.txt | sort -n | head -1)"
          grep SAMPLE samples.txt | awk 'NR%15==1'
          log show --start "$(date -r $start '+%Y-%m-%d %H:%M:%S')" --style compact --predicate 'eventMessage CONTAINS[c] "jetsam" OR eventMessage CONTAINS[c] "memorystatus" OR eventMessage CONTAINS[c] "maxproc" OR (eventMessage CONTAINS[c] "chrom" AND (eventMessage CONTAINS[c] "kill" OR eventMessage CONTAINS[c] "terminat"))' 2>&1 | tail -60
          exit $status

  # hataori for macOS, where `hataori connect` runs on the person's
  # machine: both architectures, kept as artifacts of the run.
  build-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          set -eu
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -o dist/hataori-darwin-$arch ./cmd/hataori
            test -s dist/hataori-darwin-$arch
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hataori-darwin
          path: dist/
          if-no-files-found: error

  # The dashboard's page (design, section 7.2): its built files are
  # committed, so this builds them again and fails when they differ.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: npm ci --ignore-scripts
      # Type check, and no user-visible string outside the catalog.
      - run: npm run check
      - run: npm run build
      - name: the committed build is the fresh one
        run: |
          # Ignored files too: one the build writes but Git ignores would be
          # missing from a clean checkout's binary.
          changed="$(git status --porcelain --untracked-files=all --ignored=matching -- ../internal/dashboard/page)"
          if [ -n "$changed" ]; then
            echo "internal/dashboard/page differs from a fresh build of web/."
            echo "Build it with Node $(cat .nvmrc) (npm ci && npm run build) and commit the result:"
            echo "$changed"
            git diff --stat -- ../internal/dashboard/page
            exit 1
          fi
      - name: the build is reproducible
        run: |
          npm run build -- --outDir "$RUNNER_TEMP/second"
          diff -r ../internal/dashboard/page "$RUNNER_TEMP/second"
