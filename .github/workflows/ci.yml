name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The example plugin is Python 3 (examples/plugins/marker): its tests
      # fail, not skip, without it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The host terminal tests start a tmux server of their own.
      - name: install tmux
        run: command -v tmux >/dev/null || { sudo apt-get update && sudo apt-get install -y tmux; }
      # The hataori connect tests start an sshd of their own, as this user.
      - name: install sshd
        run: test -x /usr/sbin/sshd || { sudo apt-get update && sudo apt-get install -y openssh-server; }
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      # cmd/hataori runs the daemon, session hosts and a browser for each
      # end-to-end test, and takes close to go test's default of ten minutes
      # per package on macOS (#625).
      - name: verify renamed attach regression without ownership fix
        run: |
          cp internal/core/core.go "$RUNNER_TEMP/core809.go"
          trap 'cp "$RUNNER_TEMP/core809.go" internal/core/core.go' EXIT
          python3 - <<'PY809'
          from pathlib import Path
          p = Path("internal/core/core.go")
          s = p.read_text()
          start = s.index("\t\tr, ok := c.Runner.(interface {", s.index("func (c *Core) hostPIDs"))
          end = s.index("\n\t}", start)
          p.write_text(s[:start] + s[end:])
          PY809
          set +e
          go test ./cmd/hataori -run '^TestDaemonRefusesRenamedAttachPane$' -count=1 > "$RUNNER_TEMP/regression809.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/regression809.log"
          test "$result" -ne 0
          grep -q 'linked attach accepted: <nil>' "$RUNNER_TEMP/regression809.log"
      - run: go test -timeout 30m ./...

  # The same code runs on macOS (design, section 6.4).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: install tmux
        run: command -v tmux >/dev/null || brew install tmux
      # The runner's Google Chrome can update itself while the suite runs,
      # and a browser test that starts it while its files are replaced can
      # be killed before it listens. The tests run a read-only copy of it
      # instead (HATAORI_TEST_CHROME), made before any Chrome of the job
      # runs and checked whole by its signature.
      - name: a copy of Chrome of the tests' own
        run: |
          app="/Applications/Google Chrome.app"
          if [ ! -d "$app" ]; then exit 0; fi
          dir="$RUNNER_TEMP/chrome"
          copy="$dir/Google Chrome.app"
          mkdir -p "$dir"
          cp -Rc "$app" "$copy"
          codesign --verify --deep "$copy" # every sealed file against its hash
          chmod -R a-w "$copy"
          chmod a-w "$dir"
          "$copy/Contents/MacOS/Google Chrome" --version
          echo "HATAORI_TEST_CHROME=$copy/Contents/MacOS/Google Chrome" >> "$GITHUB_ENV"
      - run: go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: go test
        run: go test -timeout 30m ./... # as in the test job (#625)
      - name: let the copy of Chrome be removed
        if: always()
        run: chmod -R u+w "$RUNNER_TEMP/chrome" 2>/dev/null || true

  # hataori for macOS, where `hataori connect` runs on the person's
  # machine: both architectures, kept as artifacts of the run.
  build-macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          set -eu
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -o dist/hataori-darwin-$arch ./cmd/hataori
            test -s dist/hataori-darwin-$arch
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hataori-darwin
          path: dist/
          if-no-files-found: error

  # The dashboard's page (design, section 7.2): its built files are
  # committed, so this builds them again and fails when they differ.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: npm ci --ignore-scripts
      # Type check, and no user-visible string outside the catalog.
      - run: npm run check
      - run: npm run build
      - name: the committed build is the fresh one
        run: |
          # Ignored files too: one the build writes but Git ignores would be
          # missing from a clean checkout's binary.
          changed="$(git status --porcelain --untracked-files=all --ignored=matching -- ../internal/dashboard/page)"
          if [ -n "$changed" ]; then
            echo "internal/dashboard/page differs from a fresh build of web/."
            echo "Build it with Node $(cat .nvmrc) (npm ci && npm run build) and commit the result:"
            echo "$changed"
            git diff --stat -- ../internal/dashboard/page
            exit 1
          fi
      - name: the build is reproducible
        run: |
          npm run build -- --outDir "$RUNNER_TEMP/second"
          diff -r ../internal/dashboard/page "$RUNNER_TEMP/second"
